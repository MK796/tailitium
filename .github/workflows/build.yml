name: Build, publish and release tailitium

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract upstream versions
        id: versions
        run: |
          TECHNITIUM_VERSION="$(grep '^FROM technitium/dns-server:' Dockerfile | sed 's#FROM technitium/dns-server:##')"
          TAILSCALE_VERSION="$(grep '^FROM tailscale/tailscale:' Dockerfile | head -n1 | sed 's#FROM tailscale/tailscale:##' | sed 's# AS tailscale##')"
          echo "technitium=${TECHNITIUM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tailscale=${TAILSCALE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "combo=t${TECHNITIUM_VERSION}-ts${TAILSCALE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Calculate next semantic version
        id: semver
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git fetch --force --tags

          LAST_TAG="$(git tag -l 'v*' --sort=-version:refname | head -n1)"

          if [ -z "$LAST_TAG" ]; then
            NEXT_TAG="v1.0.0"
          else
            VERSION="${LAST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<EOFV
          $VERSION
          EOFV
            PATCH=$((PATCH + 1))
            NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "version=${NEXT_TAG}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mk796/tailitium
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.versions.outputs.combo }},enable={{is_default_branch}}
            type=raw,value=${{ steps.semver.outputs.version }},enable=${{ steps.semver.outputs.version != '' }}
            type=sha,prefix=sha-
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=tailitium
            org.opencontainers.image.description=Technitium DNS Server with Tailscale
            org.opencontainers.image.vendor=MK796
            org.opencontainers.image.version=${{ steps.semver.outputs.version != '' && steps.semver.outputs.version || steps.versions.outputs.combo }}
            org.opencontainers.image.source=https://github.com/MK796/tailitium
            io.tailitium.technitium.version=${{ steps.versions.outputs.technitium }}
            io.tailitium.tailscale.version=${{ steps.versions.outputs.tailscale }}
            io.tailitium.combo=${{ steps.versions.outputs.combo }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build only for PRs
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push for main/tag
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create Git tag and GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.semver.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping."
            exit 0
          fi

          git tag "$TAG"
          git push origin "$TAG"

          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes