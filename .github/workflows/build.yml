name: Build, publish and release tailitium

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "README.md"

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract current upstream versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          TECHNITIUM_VERSION="$(grep '^FROM technitium/dns-server:' Dockerfile | sed 's#FROM technitium/dns-server:##')"
          TAILSCALE_VERSION="$(grep '^FROM tailscale/tailscale:' Dockerfile | head -n1 | sed 's#FROM tailscale/tailscale:##' | sed 's# AS tailscale##' | sed 's/^v//')"

          echo "technitium=${TECHNITIUM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tailscale=${TAILSCALE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "combo=t${TECHNITIUM_VERSION}-ts${TAILSCALE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Calculate release version and notes
        id: semver
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags

          CURRENT_TECH="${{ steps.versions.outputs.technitium }}"
          CURRENT_TS="${{ steps.versions.outputs.tailscale }}"

          LAST_TAG="$(git tag -l 'v*' --sort=-version:refname | head -n1 || true)"

          PREV_TECH=""
          PREV_TS=""
          RELEASE_NEEDED="false"
          NEXT_TAG=""
          VERSION_LABEL="${{ steps.versions.outputs.combo }}"

          if [ -z "${LAST_TAG}" ]; then
            NEXT_TAG="v1.0.0"
            RELEASE_NEEDED="true"
            VERSION_LABEL="${NEXT_TAG}"

            NOTES="$(printf '%s\n' \
              "Upstream changes" \
              "" \
              "- Technitium: none -> ${CURRENT_TECH}" \
              "- Tailscale: none -> ${CURRENT_TS}" \
              "" \
              "Release logic" \
              "- Initial release created automatically.")"
          else
            VERSION="${LAST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION}"

            PREV_TECH="$(git show "${LAST_TAG}:Dockerfile" | grep '^FROM technitium/dns-server:' | sed 's#FROM technitium/dns-server:##' || true)"
            PREV_TS="$(git show "${LAST_TAG}:Dockerfile" | grep '^FROM tailscale/tailscale:' | head -n1 | sed 's#FROM tailscale/tailscale:##' | sed 's# AS tailscale##' | sed 's/^v//' || true)"

            TECH_CHANGED="false"
            TS_CHANGED="false"

            [ "${CURRENT_TECH}" != "${PREV_TECH}" ] && TECH_CHANGED="true"
            [ "${CURRENT_TS}" != "${PREV_TS}" ] && TS_CHANGED="true"

            if [ "${TECH_CHANGED}" = "true" ] && [ "${TS_CHANGED}" = "true" ]; then
              MINOR=$((MINOR + 1))
              PATCH=0
              NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
              RELEASE_NEEDED="true"
              VERSION_LABEL="${NEXT_TAG}"
              CHANGE_KIND="Both upstream images changed -> minor bump"
            elif [ "${TECH_CHANGED}" = "true" ] || [ "${TS_CHANGED}" = "true" ]; then
              PATCH=$((PATCH + 1))
              NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
              RELEASE_NEEDED="true"
              VERSION_LABEL="${NEXT_TAG}"
              CHANGE_KIND="One upstream image changed -> patch bump"
            else
              CHANGE_KIND="No upstream image changed -> no new semantic release"
            fi

            NOTES="$(printf '%s\n' \
              "Upstream changes" \
              "" \
              "- Technitium: ${PREV_TECH} -> ${CURRENT_TECH}" \
              "- Tailscale: ${PREV_TS} -> ${CURRENT_TS}" \
              "" \
              "Release logic" \
              "- ${CHANGE_KIND}" \
              "- Previous release tag: ${LAST_TAG}")"
          fi

          echo "previous_tag=${LAST_TAG}" >> "$GITHUB_OUTPUT"
          echo "previous_technitium=${PREV_TECH}" >> "$GITHUB_OUTPUT"
          echo "previous_tailscale=${PREV_TS}" >> "$GITHUB_OUTPUT"
          echo "release_needed=${RELEASE_NEEDED}" >> "$GITHUB_OUTPUT"
          echo "version=${NEXT_TAG}" >> "$GITHUB_OUTPUT"
          echo "version_label=${VERSION_LABEL}" >> "$GITHUB_OUTPUT"

          {
            echo "notes<<EOF"
            printf '%s\n' "${NOTES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Write release notes to file
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.semver.outputs.release_needed == 'true'
        env:
          RELEASE_NOTES: ${{ steps.semver.outputs.notes }}
        shell: bash
        run: |
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/mk796/tailitium
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.versions.outputs.combo }},enable={{is_default_branch}}
            type=raw,value=${{ steps.semver.outputs.version }},enable=${{ steps.semver.outputs.release_needed == 'true' }}
            type=sha,prefix=sha-
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=tailitium
            org.opencontainers.image.description=Technitium DNS Server with Tailscale
            org.opencontainers.image.vendor=MK796
            org.opencontainers.image.version=${{ steps.semver.outputs.version_label }}
            org.opencontainers.image.source=https://github.com/MK796/tailitium
            io.tailitium.technitium.version=${{ steps.versions.outputs.technitium }}
            io.tailitium.tailscale.version=${{ steps.versions.outputs.tailscale }}
            io.tailitium.combo=${{ steps.versions.outputs.combo }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build only for PRs
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push for main/tag
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create Git tag and GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.semver.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.semver.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists, skipping."
            exit 0
          fi

          git tag "${TAG}"
          git push origin "${TAG}"

          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            --notes-file release-notes.md

      - name: Update README image references
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COMBO_TAG: ${{ steps.versions.outputs.combo }}
          NEW_RELEASE_TAG: ${{ steps.semver.outputs.version }}
          PREVIOUS_RELEASE_TAG: ${{ steps.semver.outputs.previous_tag }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG="${NEW_RELEASE_TAG}"
          if [ -z "${RELEASE_TAG}" ]; then
            RELEASE_TAG="${PREVIOUS_RELEASE_TAG}"
          fi
          export RELEASE_TAG

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")

          release_tag = os.environ.get("RELEASE_TAG", "").strip()
          combo_tag = os.environ["COMBO_TAG"].strip()

          if not release_tag:
              release_tag = "v1.0.0"

          replacement = f"""## Example image references

          Use the newest published image:
          ```yaml
          image: ghcr.io/MK796/tailitium:latest
          ```

          Use a specific release tag:
          ```yaml
          image: ghcr.io/MK796/tailitium:{release_tag}
          ```

          Use an upstream-combination tag:
          ```yaml
          image: ghcr.io/MK796/tailitium:{combo_tag}
          ```

          ## Important notes"""

          pattern = r"## Example image references.*?## Important notes"
          new_content, count = re.subn(pattern, replacement, content, flags=re.S)

          if count != 1:
              raise SystemExit("Expected exactly one 'Example image references' section in README.md")

          readme.write_text(new_content, encoding="utf-8")
          PY

      - name: Commit updated README
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- README.md; then
            echo "README already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "Update README image tag examples"
          git push